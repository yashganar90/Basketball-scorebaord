<!DOCTYPE html>
<html>
  <head>
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css" />
    <link
      href="https://fonts.cdnfonts.com/css/cursed-timer-ulil"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="scoreboard">
        <div class="team">
          <h3>HOME</h3>
          <div class="score-box">
            <h2 id="home-score">0</h2>
          </div>
          <div class="buttons">
            <button onclick="home_increment_1()">+1</button>
            <button onclick="home_increment_2()">+2</button>
            <button onclick="home_increment_3()">+3</button>
          </div>
        </div>

        <div class="team">
          <h3>GUEST</h3>
          <div class="score-box">
            <h2 id="guest-score">0</h2>
          </div>
          <div class="buttons">
            <button onclick="guest_increment_1()">+1</button>
            <button onclick="guest_increment_2()">+2</button>
            <button onclick="guest_increment_3()">+3</button>
          </div>
        </div>
      </div>

      <div class="reset">
        <button onclick="resetScores()">RESET</button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
